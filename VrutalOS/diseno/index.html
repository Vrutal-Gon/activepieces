/* Cuándo: convierte entre el texto "14 oct · 09:00" (como se enseña) y fecha/hora separadas (como se eligen) */
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function parseWhen(str) {
  const m = /(\d{1,2})\s+([a-zñ]{3,})\D+(\d{1,2}):(\d{2})/i.exec(str || '');
  if (!m) return { date: '', time: '' };
  const monIdx = MESES.findIndex((x) => m[2].toLowerCase().startsWith(x));
  if (monIdx < 0) return { date: '', time: '' };
  return { date: `2026-${String(monIdx + 1).padStart(2, '0')}-${String(Number(m[1])).padStart(2, '0')}`, time: `${m[3]}:${m[4]}` };
}
function formatWhen(date, time) {
  if (!date) return time ? `Sin fecha · ${time}` : 'Sin fecha';
  const [, mo, d] = date.split('-').map(Number);
  return `${d} ${MESES[mo - 1]} · ${time || '00:00'}`;
}

/* Minigráfica de 12 puntos para una fila de tabla: línea en gris, último punto en el acento (contrato stat-tile) */
function sparkline(values) {
  const w = 72, h = 24, pad = 3;
  const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
  const stepX = (w - pad * 2) / (values.length - 1);
  const pts = values.map((v, i) => [pad + i * stepX, h - pad - ((v - min) / span) * (h - pad * 2)]);
  const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const [lx, ly] = pts[pts.length - 1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" focusable="false">
    <path d="${path}" fill="none" stroke="var(--text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4" fill="var(--action)" stroke="var(--bg-surface)" stroke-width="2" />
  </svg>`;
}

/* Gráfico de evolución (línea + área, una sola serie) con cruceta y tooltip al pasar el ratón */
function evolutionChart(channel, weeks, values) {
  const w = 560, h = 180, padL = 44, padR = 16, padT = 12, padB = 28;
  const max = Math.ceil(Math.max(...values) / 2000) * 2000 || 1000;
  const x = (i) => padL + (i * (w - padL - padR)) / (weeks.length - 1);
  const y = (v) => h - padB - (v / max) * (h - padT - padB);
  const pts = values.map((v, i) => [x(i), y(v)]);
  const linePath = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const areaPath = `${linePath} L${pts[pts.length - 1][0].toFixed(1)},${(h - padB).toFixed(1)} L${pts[0][0].toFixed(1)},${(h - padB).toFixed(1)} Z`;
  const ticks = [0, max / 2, max];
  const last = pts[pts.length - 1];
  return `<div class="eviz" data-channel="${esc(channel)}">
    <svg class="eviz__svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Evolución de alcance en ${esc(channel)}, últimas ${weeks.length} semanas">
      ${ticks.map((t) => `<line class="eviz__grid" x1="${padL}" x2="${w - padR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" />`).join('')}
      ${ticks.map((t) => `<text class="eviz__axislabel" x="${padL - 8}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end">${fmtK(t)}</text>`).join('')}
      ${weeks.map((wk, i) => (i % 2 === 0 ? `<text class="eviz__axislabel" x="${x(i).toFixed(1)}" y="${h - 8}" text-anchor="middle">${wk}</text>` : '')).join('')}
      <path class="eviz__area" d="${areaPath}" />
      <path class="eviz__line" d="${linePath}" fill="none" />
      <circle class="eviz__end" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" />
      <text class="eviz__endlabel" x="${(last[0] + 8).toFixed(1)}" y="${(last[1] - 8).toFixed(1)}">${fmtK(values[values.length - 1])}</text>
      <line class="eviz__crosshair" x1="${padL}" x2="${padL}" y1="${padT}" y2="${h - padB}" />
      ${weeks.map((wk, i) => `<circle class="eviz__hit" data-i="${i}" data-x="${x(i).toFixed(1)}" data-week="${wk}" data-value="${values[i]}" cx="${x(i).toFixed(1)}" cy="${y(values[i]).toFixed(1)}" r="10" />`).join('')}
    </svg>
    <div class="eviz__tooltip" hidden></div>
  </div>`;
}

/* Vuelve a enganchar la interacción de los gráficos de evolución tras cada render (el innerHTML se regenera entero) */
function wireCharts() {
  document.querySelectorAll('.eviz').forEach((box) => {
    const svg = box.querySelector('.eviz__svg');
    const crosshair = box.querySelector('.eviz__crosshair');
    const tooltip = box.querySelector('.eviz__tooltip');
    const hits = [...box.querySelectorAll('.eviz__hit')];
    const hide = () => { crosshair.style.display = 'none'; tooltip.hidden = true; };
    const show = (hit) => {
      const xSvg = Number(hit.dataset.x);
      crosshair.setAttribute('x1', xSvg); crosshair.setAttribute('x2', xSvg); crosshair.style.display = '';
      const rect = svg.getBoundingClientRect();
      const pxLeft = rect.width ? (xSvg / 560) * rect.width : xSvg;
      tooltip.hidden = false;
      tooltip.innerHTML = `<strong>${Number(hit.dataset.value).toLocaleString('es-ES')}</strong><span>${hit.dataset.week}</span>`;
      tooltip.style.left = Math.min(Math.max(pxLeft, 8), Math.max(rect.width - 8, 8)) + 'px';
    };
    svg.addEventListener('pointermove', (e) => {
      const rect = svg.getBoundingClientRect();
      const svgX = rect.width ? ((e.clientX - rect.left) / rect.width) * 560 : 0;
      let nearest = hits[0], best = Infinity;
      for (const hit of hits) { const d = Math.abs(Number(hit.dataset.x) - svgX); if (d < best) { best = d; nearest = hit; } }
      if (nearest) show(nearest);
    });
    svg.addEventListener('pointerleave', hide);
    hide();
  });
}

/* ---------- Shell ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const initials = (n) => n.split(/\s+/).map((p) => p[0]).slice(0, 2).join('').toUpperCase();

          <a href="#" class="side-nav__link ${i.pending ? 'side-nav__link--soon' : ''}" ${i.pending ? 'title="Pendiente de diseño"' : ''} data-screen="${i.id}" ${i.id === state.screen ? 'aria-current="page"' : ''}>

}

function renderModal() {

    const d = CP_DATA.borradores[m.idx];

    const vals = ov('draft:' + m.idx, { channel: d[1], when: d[6] });
    const when = parseWhen(vals.when);
    return `<div class="modal-scrim"><div class="modal" role="dialog" aria-modal="true">
      <div class="modal__head"><div><h2 class="modal__title">${d[0]}</h2><span class="muted small">${d[3]}</span></div>
        <button class="icon-button" data-close-modal aria-label="Cerrar">✕</button></div>
      <p class="modal__body">${esc(d[4])}</p>
      <div class="modal__field"><label for="modal-draft-channel">Canal</label>
        <select id="modal-draft-channel" class="text-input">${CP_DATA.canales.map((c) => `<option ${c[0] === vals.channel ? 'selected' : ''} ${c[1] === 'bad' ? 'disabled' : ''}>${c[0]}</option>`).join('')}</select></div>
      <div class="modal__field"><label>Cuándo</label><div class="row"><input id="modal-draft-date" type="date" class="text-input" value="${when.date}" /><input id="modal-draft-time" type="time" class="text-input" value="${when.time}" /></div></div>
      ${decision
        ? `<div>${pill(decision === 'aprobada' ? 'Aprobada' : 'Rechazada', decision === 'aprobada' ? 'ok' : 'bad')}</div>`
        : `<div class="row row--end"><button class="btn btn--ghost btn--sm" data-save-draft="${m.idx}">Guardar cambios</button><button class="btn btn--danger btn--sm" data-reject-draft="${m.idx}">Rechazar</button><button class="btn btn--primary btn--sm" data-approve-draft="${m.idx}">Aprobar</button></div>`}
    </div></div>`;
  }
  if (m.type === 'metric') {
    const rows = CP_DATA.metricDetalle[m.channel] || [];
    return `<div class="modal-scrim"><div class="modal modal--wide" role="dialog" aria-modal="true">
      <div class="modal__head"><h2 class="modal__title">${m.channel} · detalle</h2><button class="icon-button" data-close-modal aria-label="Cerrar">✕</button></div>
      <div><h3 class="muted small" style="margin:0 0 var(--space-2)">Evolución del alcance</h3>${evolutionChart(m.channel, CP_DATA.evolucionSemanas, CP_DATA.evolucionAlcance[m.channel] || [])}</div>
      <div><h3 class="muted small" style="margin:0 0 var(--space-2)">Por publicación</h3>
      <table class="data-table"><thead><tr><th>Pieza</th><th>Publicado</th><th class="data-table__num">Alcance</th><th class="data-table__num">Me gusta</th><th class="data-table__num">Comentarios</th><th class="data-table__num">Compartidos</th><th class="data-table__num">Clics</th></tr></thead><tbody>
        ${rows.map((r) => `<tr><td><span class="data-table__primary">${r[0]}</span></td><td class="mono">${r[1]}</td><td class="data-table__num mono">${r[2]}</td><td class="data-table__num mono">${r[3]}</td><td class="data-table__num mono">${r[4]}</td><td class="data-table__num mono">${r[5]}</td><td class="data-table__num mono">${r[6]}</td></tr>`).join('')}
      </tbody></table></div>
    </div></div>`;
  }
  if (m.type === 'card') {
    const fila = boardTarjetas().find((x) => x.t[0] === m.id);
    if (!fila) return '';
    const { t, espec } = fila;
    const col = BOARD.columnas.find((c) => c[0] === t[3]);
    const [prio, prioTono] = PRIORIDAD[t[4]] || ['', ''];
    const hilo = BOARD.comentarios[t[0]] || [];
    return `<div class="modal-scrim"><div class="modal" role="dialog" aria-modal="true">
      <div class="modal__head agente agente--${espec[3]}"><div><h2 class="modal__title">${esc(t[2])}</h2>
        <span class="muted small"><span class="agente__punto" aria-hidden="true"></span>${esc(espec[1])} · <span class="mono">${espec[2]}-${t[1]}</span> · ${esc(col ? col[1] : t[3])}${t[5] ? ' · ' + esc(t[5]) : ''}</span></div>
        <button class="icon-button" data-close-modal aria-label="Cerrar">✕</button></div>
      <div class="board__meta">${prio ? pill(prio, prioTono) : ''}${t[7] === 'cliente' ? pill('Pedida por ti', 'pending') : ''}${t[6].map((l) => `<span class="chip chip--sm">${esc(l)}</span>`).join('')}</div>
      <p class="modal__body" style="white-space:pre-line">${esc(t[8])}</p>
      <div><h3 class="muted small" style="margin:0 0 var(--space-2)">Conversación</h3>
        ${hilo.length === 0 ? `<p class="muted small">Todavía no hay comentarios.</p>` : `<ul class="attention">${hilo.map((c) => `
          <li class="attention__item"><div><span class="attention__title">${esc(c[0])}</span><span class="attention__detail">${esc(c[1])}</span><span class="muted small">${esc(c[2])}</span></div></li>`).join('')}</ul>`}
      </div>
      <div class="modal__field"><label for="modal-card-comment">Comentar</label>
        <textarea id="modal-card-comment" class="text-input" rows="3" placeholder="Lo que quieras decirle al equipo sobre esta tarea"></textarea></div>
      <div class="row row--end"><button class="btn btn--ghost btn--sm" data-close-modal>Cerrar</button><button class="btn btn--primary btn--sm" data-send-comment="${t[0]}">Enviar comentario</button></div>
    </div></div>`;
  }
  if (m.type === 'newcard') {
    const porDefecto = state.boardFiltro.size === 1 ? [...state.boardFiltro][0] : BOARD.especialistas[0][0];
    return `<div class="modal-scrim"><div class="modal" role="dialog" aria-modal="true">
      <div class="modal__head"><h2 class="modal__title">Pedir una tarea</h2><button class="icon-button" data-close-modal aria-label="Cerrar">✕</button></div>
      <div class="modal__field"><label for="modal-card-agente">A quién se lo pides</label>
        <select id="modal-card-agente" class="text-input">${BOARD.especialistas.map((e) => `<option value="${e[0]}" ${e[0] === porDefecto ? 'selected' : ''}>${esc(e[1])}</option>`).join('')}</select></div>
      <div class="modal__field"><label for="modal-card-title">Qué necesitas</label>

      : { title: CP_DATA.publicaciones[m.idx][0], when: CP_DATA.publicaciones[m.idx][2], channel: CP_DATA.publicaciones[m.idx][1] };
    const cur = ov(`${m.source}:${m.idx}`, base);
    const when = parseWhen(cur.when);
    return `<div class="modal-scrim"><div class="modal" role="dialog" aria-modal="true">
      <div class="modal__head"><h2 class="modal__title">Editar publicación</h2><button class="icon-button" data-close-modal aria-label="Cerrar">✕</button></div>

        <select id="modal-channel" class="text-input">${CP_DATA.canales.map((c) => `<option ${c[0] === cur.channel ? 'selected' : ''} ${c[1] === 'bad' ? 'disabled' : ''}>${c[0]}</option>`).join('')}</select></div>

      <div class="row row--end"><button class="btn btn--ghost btn--sm" data-close-modal>Cancelar</button><button class="btn btn--primary btn--sm" data-save-edit="${m.source}:${m.idx}">Guardar cambios</button></div>
    </div></div>`;

  if (m.type === 'create') {
    return `<div class="modal-scrim"><div class="modal" role="dialog" aria-modal="true">
      <div class="modal__head"><h2 class="modal__title">Nueva publicación</h2><button class="icon-button" data-close-modal aria-label="Cerrar">✕</button></div>

/* ---------- Eventos ---------- */
document.addEventListener('click', (e) => {
  if (e.target.classList && e.target.classList.contains('modal-scrim')) { state.modal = null; render(); return; }
  const t = e.target.closest('[data-layout],[data-ws],[data-screen],[data-go],[data-convo],[data-ctab],[data-calview],[data-edit],[data-draft],[data-metric],[data-pause],[data-approve-draft],[data-reject-draft],[data-save-draft],[data-save-edit],[data-close-modal],[data-chat],[data-chat-approve],[data-chat-reject],[data-new-post],[data-save-create],[data-open-chat],[data-close-chat],[data-toggle-nav],[data-close-nav],[data-board-spec],[data-board-todos],[data-card],[data-new-card],[data-save-card],[data-send-comment]');
  if (!t) return;
  e.preventDefault();
  if (t.dataset.layout) { state.layout = t.dataset.layout; state.workspace = 'trabajo'; state.screen = 'inicio';
    document.querySelectorAll('[data-layout]').forEach((b) => b.setAttribute('aria-pressed', String(b === t))); }
  else if (t.dataset.go) { if (t.dataset.ws && state.layout === 'admin') state.workspace = t.dataset.ws; state.screen = t.dataset.go; }
  else if (t.dataset.ws) { state.workspace = t.dataset.ws; state.screen = WORKSPACES[t.dataset.ws].home; }
  else if (t.dataset.screen) { state.screen = t.dataset.screen; state.navOpen = false; }
  else if (t.dataset.convo) { state.convo = Number(t.dataset.convo); }
  else if (t.dataset.ctab) { state.ctab = t.dataset.ctab; }
  else if (t.dataset.calview) { state.calView = t.dataset.calview; }
  else if (t.dataset.draft) { state.modal = { type: 'draft', idx: Number(t.dataset.draft) }; }
  else if (t.dataset.metric) { state.modal = { type: 'metric', channel: t.dataset.metric }; }
  else if (t.dataset.pause) { const i = Number(t.dataset.pause); state.pausedPosts.has(i) ? state.pausedPosts.delete(i) : state.pausedPosts.add(i); }
  else if (t.dataset.edit) { const [source, idx] = t.dataset.edit.split(':'); state.modal = { type: 'edit', source, idx: Number(idx) }; }
  else if (t.dataset.saveDraft) { state.overrides['draft:' + t.dataset.saveDraft] = { channel: $('#modal-draft-channel').value, when: formatWhen($('#modal-draft-date').value, $('#modal-draft-time').value) }; state.modal = null; }
  else if (t.dataset.approveDraft) {
    const idx = Number(t.dataset.approveDraft);
    state.draftDecision[idx] = 'aprobada';
    if (!state.draftPublished.has(idx)) {
      state.draftPublished.add(idx);
      const d = CP_DATA.borradores[idx];
      const vals = ov('draft:' + idx, { channel: d[1], when: d[6] });
      CP_DATA.publicaciones.push([d[0], vals.channel, vals.when, 'warn', 'Programado', false]);
    }
    state.modal = null;
  }
  else if (t.dataset.rejectDraft) { state.draftDecision[Number(t.dataset.rejectDraft)] = 'rechazada'; state.modal = null; }
  else if (t.dataset.saveEdit) { state.overrides[t.dataset.saveEdit] = { title: $('#modal-title').value, when: formatWhen($('#modal-when-date').value, $('#modal-when-time').value), channel: $('#modal-channel').value }; state.modal = null; }
  else if (t.hasAttribute('data-new-post')) { state.modal = { type: 'create' }; }
  else if (t.hasAttribute('data-save-create')) {
    const tags = $('#modal-new-tags').value.trim();
    const body = ($('#modal-new-body').value.trim() || 'Publicación sin texto') + (tags ? '\n\n' + tags : '');
    const channel = $('#modal-new-channel').value;
    const when = formatWhen($('#modal-new-date').value, $('#modal-new-time').value);
    state.manualPostIdx.add(CP_DATA.publicaciones.length);
    CP_DATA.publicaciones.push([body, channel, when, 'warn', 'Programado', false]);
    state.modal = null;
  }
  else if (t.dataset.boardSpec) {
    const k = t.dataset.boardSpec;
    state.boardFiltro.has(k) ? state.boardFiltro.delete(k) : state.boardFiltro.add(k);
  }
  else if (t.hasAttribute("data-board-todos")) { state.boardFiltro.clear(); }
  else if (t.dataset.card) { state.modal = { type: 'card', id: t.dataset.card }; }
  else if (t.hasAttribute('data-new-card')) { state.modal = { type: 'newcard' }; }
  else if (t.hasAttribute('data-save-card')) {
    // Lo que hará board-write: la tarjeta nace en la PRIMERA columna y marcada como del cliente.
    const clave = $('#modal-card-agente').value;
    const espec = BOARD.especialistas.find((x) => x[0] === clave) || BOARD.especialistas[0];
    const titulo = $('#modal-card-title').value.trim() || 'Tarea sin título';
    const detalle = $('#modal-card-desc').value.trim();
    const lista = BOARD.tarjetas[espec[0]] || (BOARD.tarjetas[espec[0]] = []);
    const siguiente = Math.max(0, ...lista.map((c) => c[1])) + 1;
    lista.push(['c' + siguiente, siguiente, titulo, BOARD.columnas[0][0], 'no-priority', null, [], 'cliente',
      (detalle ? detalle + '\n\n—\n' : '') + `Pedido por ${PEOPLE[state.layout].name} desde VrutalOS.`]);
    state.modal = null;
  }
  else if (t.dataset.sendComment) {
    const id = t.dataset.sendComment;
    const texto = $('#modal-card-comment').value.trim();
    if (texto) (BOARD.comentarios[id] = BOARD.comentarios[id] || []).push([PEOPLE[state.layout].name, texto, 'ahora']);
    state.modal = null;
  }
  else if (t.hasAttribute('data-close-modal')) { state.modal = null; }
  else if (t.dataset.chat) { state.chatAnchor = t.dataset.chat; state.screen = 'conversaciones'; state.workspace = 'trabajo'; state.convo = 2; }
  else if (t.dataset.chatApprove) { state.chatDecision[t.dataset.chatApprove] = 'aprobada'; }
  else if (t.dataset.chatReject) { state.chatDecision[t.dataset.chatReject] = 'rechazada'; }
  else if (t.hasAttribute('data-open-chat')) { state.floatingChatOpen = true; }
  else if (t.hasAttribute('data-close-chat')) { state.floatingChatOpen = false; }
  else if (t.hasAttribute('data-toggle-nav')) { state.navOpen = !state.navOpen; }
  else if (t.hasAttribute('data-close-nav')) { state.navOpen = false; }
  render();
});
// Enlace directo para revisar: index.html#admin/integraciones  |  #usuario/aprobaciones
const [hl, hs] = location.hash.slice(1).split('/');
if (PEOPLE[hl]) {
  state.layout = hl;
  document.querySelectorAll('[data-layout]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.layout === hl)));
  if (hs && (SCREENS[hs] || PENDING[hs])) {
    state.screen = hs;
    state.workspace = WORKSPACES.admin.groups.some((g) => g.items.some((i) => i.id === hs)) ? 'admin' : 'trabajo';
  }
}
render();
</script>
</body>
</html>
